services:
  yt-cipher:
    # No published image tag could be verified upstream, so build from a
    # pinned commit of the project's own root Dockerfile (Compose git context).
    # Active project: https://github.com/kikkia/yt-cipher (commit 91d55a2).
    # API_TOKEN is intentionally unset: the service is internal-only and the
    # youtube-source remoteCipher config then needs no password.
    build:
      context: https://github.com/kikkia/yt-cipher.git#91d55a24fafd83fa85f72dfe6914626b05f799f6
      dockerfile: Dockerfile
    container_name: wavemelo-yt-cipher
    restart: unless-stopped
    environment:
      # Source-confirmed variable (README's OVERRIDE_SCRIPT_VARIANT does not
      # exist in code); upstream compose uses IAS.
      OVERRIDE_PLAYER_VARIANT: "IAS"
      PORT: "8001"
      HOST: "0.0.0.0"
    # No host port publish: only Lavalink reaches this service, over the
    # internal bridge network.
    networks:
      - wavemelo

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: wavemelo-lavalink
    restart: unless-stopped
    depends_on:
      yt-cipher:
        condition: service_started
    environment:
      # Documented Lavalink env override; takes precedence over application.yml.
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in .env}
      # The image entrypoint is `java -jar`, which never reads JAVA_OPTS.
      # JAVA_TOOL_OPTIONS is picked up by the JVM itself.
      JAVA_TOOL_OPTIONS: "-Xmx1G"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # No named volumes for plugins/logs: the image runs as uid 322 and a
      # fresh named volume would be root-owned, breaking plugin downloads.
      # Plugins re-download into the container layer on re-creation.
    ports:
      # Loopback-only publish: lets a local `cargo run` reach the node
      # without exposing it to the LAN. Remove for remote-only deployments.
      - "127.0.0.1:2333:2333"
    healthcheck:
      # TCP probe via bash /dev/tcp; avoids depending on curl/wget being
      # present in the base image. Spring opens the port last at startup.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - wavemelo

  bot:
    build: .
    container_name: wavemelo-bot
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in .env}
      LAVALINK_SECURE: "false"
      RUST_LOG: ${RUST_LOG:-info,wavemelo=debug}
    networks:
      - wavemelo

networks:
  wavemelo:
    driver: bridge
