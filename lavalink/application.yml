# Lavalink v4 configuration for wavemelo.
#
# Sources for keys and defaults:
#   - Lavalink application.yml.example (lavalink-devs/Lavalink)
#   - youtube-source 1.18.2 plugin README (lavalink-devs/youtube-source)
#   - LavaSrc README (topi314/LavaSrc)
#   - yt-cipher README (kikkia/yt-cipher) for remote cipher + timeouts
#
# Environment variables take precedence over this file (see
# https://lavalink.dev/configuration/). docker-compose.yml overrides the
# password via LAVALINK_SERVER_PASSWORD, so no placeholders are needed here.

server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Plugin jars are auto-downloaded into ./plugins on first startup.
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"

  server:
    # Development default; overridden by LAVALINK_SERVER_PASSWORD in compose.
    password: "youshallnotpass"
    sources:
      # The built-in YouTube source is deprecated; the youtube-plugin
      # replaces it and requires this toggle to be false.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    # yt-cipher README: raise HTTP timeouts if remote deciphering is slow.
    timeouts:
      connectTimeoutMs: 10000
      connectionRequestTimeoutMs: 10000
      socketTimeoutMs: 10000

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO

plugins:
  youtube:
    enabled: true
    # Zero-OAuth client list. ANDROID_VR/TV were dropped: they can require
    # sign-in. MUSIC is metadata/search only; the rest support playback.
    # Identifiers verified against the 1.18.2 README "Available Clients" table.
    clients:
      - MUSIC
      - WEB
      - MWEB
      - WEBEMBEDDED
      - TVHTML5_SIMPLY
    # Self-hosted yt-cipher sidecar solves signature/n-parameter deciphering
    # ("No supported audio streams available") without any login.
    # Keys verified against the 1.18.2 README "Using a remote cipher server".
    # The sidecar is on the internal Compose network and has no API_TOKEN,
    # so no password is needed. See docker-compose.yml for the service.
    remoteCipher:
      url: "http://yt-cipher:8001/"
      userAgent: "wavemelo"

  lavasrc:
    providers:
      # Fallback providers used when mirroring metadata onto playable tracks.
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      # All extra sources stay disabled until credentials are configured.
      # See the LavaSrc README for per-source setup (Spotify, Deezer, ...).
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      vkmusic: false
