[package]
name = "wavemelo"
version = "0.10.0"
edition = "2021"
license = "MIT"

[dependencies]
dotenvy = "0.15"
lavalink-rs = { version = "0.15.0", default-features = false, features = [
    "macros",
    "serenity",
    "tungstenite-rustls-native-roots",
] }
poise = { version = "0.7.1", default-features = false, features = ["cache", "handle_panics"] }
serde_json = "1"
serenity = { version = "0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "framework",
    "gateway",
    "model",
    "rustls_backend",
    "utils",
] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.21", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "json",
    "registry",
    "std",
] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
incremental = false
strip = "symbols"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
