[package]
name = "wavemelo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
dotenvy = "0.15"
poise = { version = "0.7.1", default-features = false, features = ["cache", "handle_panics"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serenity = { version = "0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "framework",
    "gateway",
    "model",
    "rustls_backend",
    "utils",
    "voice",
] }
songbird = { version = "0.6.1", default-features = false, features = [
    "builtin-queue",
    "driver",
    "gateway",
    "rustls",
    "serenity",
    "tungstenite",
] }
symphonia = { version = "0.5.2", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "registry",
    "std",
] }

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
